[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagen"
version = "0.1.0"
description = "Pipeline di analisi, montaggio ritagli per Instagram Reel e strategia hashtag (Millennium's Bug tail effect)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scenedetect[opencv-headless]>=0.7.2",
    "faster-whisper>=1.0.0",
    "mediapipe>=0.10.14",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
